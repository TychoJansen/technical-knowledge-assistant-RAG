[project]
name = "technical-knowledge-assistant-RAG"
version = "0.1.0"
description = ""
authors = [
    {name = "Tycho Jansen",email = "tycho.jansen@live.nl"}
]
readme = "README.md"
requires-python = ">=3.11"

[tool.poetry]
packages = [{ include = "rag_assistant", from = "src" }]

[tool.poetry.dependencies]
datasets = "^5.1.0"
pandas = "^3.0.6"
pyarrow = "^26.0.0"
bm25s = "^0.3.14"
pystemmer = "^3.1.0"
ipykernel = "^7.4.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ipykernel (>=7.4.0,<8.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "nbformat (>=5.11.1,<6.0.0)",
    "nbclient (>=0.11.0,<0.12.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
